name: Build RenFletPy 2D Test APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "game/**"
      - "tools/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "game/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: renfletpy-2d-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
      UPSTREAM_SDK_COMMIT: "5c62e000ace7cdc1a0e3558bc2bdde080f425859"
      RENPY_VERSION: "8.5.3"

    steps:
      - name: Check out 2D test
        uses: actions/checkout@v4

      - name: Set up Ren'Py live smoke test
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          curl --fail --location --retry 2 \
            "https://www.renpy.org/dl/$RENPY_VERSION/renpy-$RENPY_VERSION-sdk.tar.bz2" \
            --output "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          tar -xjf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP"

      - name: Test basic demo in Ren'Py before building APK
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout 120 "$RUNNER_TEMP/renpy-$RENPY_VERSION-sdk/renpy.sh" \
            "$GITHUB_WORKSPACE" test basic_tactics --report-detailed --overwrite-screenshots

      - name: Upload basic demo test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basic-demo-smoke
          path: |
            tests/screenshots/*.png
            log.txt
            traceback.txt
            errors.txt

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android command-line tools to PATH
        shell: bash
        run: |
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then
                sdk_tools_bin="$candidate"
                break
              fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Clone pinned RenFletPy upstream
        shell: bash
        run: |
          git clone https://github.com/hujuhhujuh9-max/SDK-.git upstream-sdk
          git -C upstream-sdk checkout "$UPSTREAM_SDK_COMMIT"
          test "$(git -C upstream-sdk rev-parse HEAD)" = "$UPSTREAM_SDK_COMMIT"

      - name: Overlay game and prepare independent host
        shell: bash
        run: |
          rm -rf upstream-sdk/game
          git archive HEAD game | tar -x -C upstream-sdk
          python3 tools/prepare_upstream.py upstream-sdk

      - name: Install build requirements
        shell: bash
        working-directory: upstream-sdk
        run: |
          python3 --version
          python3 -m venv .android-build/venv
          .android-build/venv/bin/python -m pip install -r requirements-build.txt -r runtime/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Build APK
        shell: bash
        working-directory: upstream-sdk
        run: |
          .android-build/venv/bin/python build_android.py

      - name: Enable Android emulator acceleration
        shell: bash
        run: sudo chmod 666 /dev/kvm

      - name: Test basic demo on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            upstream-sdk/.android-build/venv/bin/python -m pip install Pillow
            upstream-sdk/.android-build/venv/bin/python tools/smoke_android.py upstream-sdk/.android-build/outputs/runner-debug-x86_64.apk

      - name: Upload Android live test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-demo-smoke
          path: android-smoke/
          if-no-files-found: ignore

      - name: Build phone-sized arm64 APK
        shell: bash
        working-directory: upstream-sdk/.android-build/integration/android
        run: |
          ./gradlew --no-daemon -PrunnerAbi=arm64-v8a :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/renfletpy-2d-test-arm64.apk"

      - name: Inspect phone APK
        shell: bash
        run: |
          ls -lh renfletpy-2d-test-arm64.apk
          sha256sum renfletpy-2d-test-arm64.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: renfletpy-2d-test-arm64
          path: renfletpy-2d-test-arm64.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish direct phone download
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view phone-latest >/dev/null 2>&1; then
            gh release create phone-latest               --title "RenFletPy 2D Test - Phone Build"               --notes "Latest arm64 Android test build. Download the APK directly on your phone."
          fi
          gh release upload phone-latest renfletpy-2d-test-arm64.apk --clobber
